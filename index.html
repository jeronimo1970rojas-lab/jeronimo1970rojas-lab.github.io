<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>App Escolar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/framework7@7/framework7-bundle.min.css">

  <style>
    body { margin:0; }
    .inicio {
      background: linear-gradient(135deg,#1565c0,#42a5f5);
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      align-items:center;
      padding:20px;
      color:white;
      text-align:center;
    }
  </style>
</head>

<body>

<div id="app">
  <div class="view view-main"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/framework7@7/framework7-bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {

  var app = new Framework7();

  var mainView = app.views.create('.view-main', {
    url: '/'
  });

  // PANTALLA INICIAL
  mainView.router.navigate({
    content: `
    <div class="page no-navbar">
      <div class="page-content inicio">
        <h2>PRE PROMO B</h2>
        <p>Bienvenido</p>
      </div>
    </div>
    `
  });

});
</script>

</body>
</html>
